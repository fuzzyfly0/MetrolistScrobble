name: Release APK

on:
  push:
    tags:
      - "v*"
    # Every other branch gets a test APK as a workflow artifact, without a release.
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleIzzyRelease -x lint --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.scrobble
          METROLIST_APP_NAME: Metrolist Scrobble
          PULL_REQUEST: "false"

      # A stable key is needed so that newer releases install as updates over older ones.
      - name: Sign APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD repository secrets"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          UNSIGNED=$(find app/build/outputs/apk/izzy/release -name "*.apk" | head -1)
          APK="out/Metrolist-Scrobble.apk"
          mkdir -p out
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias scrobble \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:SIGNING_PASSWORD \
            --out "$APK" \
            "$UNSIGNED"
          "$APKSIGNER" verify "$APK"

      # Same naming as upstream Metrolist: tag "v1.2.3", release title "1.2.3".
      - name: Release title
        if: startsWith(github.ref, 'refs/tags/')
        id: title
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.title.outputs.version }}
          files: out/*.apk
          body: |
            Metrolist fork that records what you play in other music apps into a local playlist, without duplicates.

            Setup instructions are in the README.

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: metrolist-scrobble
          path: out/*.apk
